<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Quorum</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- <link rel="icon" type="image/x-icon" href="favicon.ico"> -->
    <link href="public/app-brand-logo.svg" rel="icon" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Doto:wght@400;700;900&display=swap" rel="stylesheet">
  <meta name="color-scheme" content="light dark">
  <script>
    // Apply the saved (or system) theme before first paint so there is no light flash.
    try {
      var t = localStorage.getItem('fauxtrade-theme');
      if (t !== 'light' && t !== 'dark') {
        t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
