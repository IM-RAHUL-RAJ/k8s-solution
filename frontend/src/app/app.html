<main class="shell">
  <header class="shell__header">
    <p class="shell__eyebrow">Enterprise Trading Platform</p>
    <h1>{{ title() }}</h1>
    <p class="shell__lead">
      Angular 21 standalone workspace for the sprint frontend.
    </p>

    <nav class="shell__nav" aria-label="Primary">
      @for (item of navigation(); track item.path) {
        <a [routerLink]="item.path">{{ item.label }}</a>
      }
    </nav>
  </header>

  <section class="shell__content">
    <router-outlet />
  </section>
</main>
