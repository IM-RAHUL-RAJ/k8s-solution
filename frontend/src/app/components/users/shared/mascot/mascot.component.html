<span class="mascot" [class.mascot--loading]="state() === 'loading'" [class.mascot--happy]="state() === 'happy'"
      [class.mascot--empty]="state() === 'empty'" [style.width.px]="size()" [style.height.px]="size()" data-testid="mascot"
      [attr.data-type]="resolvedType()" [attr.data-state]="state()">
  @if (thought(); as text) {
    <span class="mascot__thought" role="status">{{ text }}</span>
  }
  @if (state() === 'loading') {
    <span class="mascot__ring" aria-hidden="true"></span>
  }
  @if (interactive()) {
    <button type="button" class="mascot__art mascot__btn" (click)="poke()" [attr.aria-label]="label() + '. Tap to hear a thought'" [innerHTML]="svg()"></button>
  } @else {
    <span class="mascot__art" [innerHTML]="svg()"></span>
  }
</span>
