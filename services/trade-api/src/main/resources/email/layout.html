<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>{{subject}}</title>
<style>
  /* Dark mode for clients that support it; every colour is also inlined below for the ones that do not. */
  @media (prefers-color-scheme: dark) {
    .bg { background-color: #0f1115 !important; }
    .card { background-color: #181b22 !important; border-color: #2a2f3a !important; }
    .ink { color: #f2f3f5 !important; }
    .muted { color: #a1a7b3 !important; }
    .chip { background-color: #232834 !important; color: #e6e8ec !important; }
  }
  @media only screen and (max-width: 600px) {
    .wrap { width: 100% !important; }
    .pad { padding: 24px 20px !important; }
    .mascot { width: 128px !important; height: 128px !important; }
  }
</style>
</head>
<body class="bg" style="margin:0;padding:0;background-color:#f5f5f7;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{preheader}}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="bg" style="background-color:#f5f5f7;">
  <tr>
    <td align="center" style="padding:32px 12px;">
      <table role="presentation" class="wrap" width="560" cellpadding="0" cellspacing="0" border="0" style="width:560px;max-width:560px;">
        <tr>
          <td style="padding:0 8px 16px 8px;font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:18px;font-weight:700;letter-spacing:0.02em;color:#1a1a1a;" class="ink">
            <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background-color:{{accent}};margin-right:8px;"></span>Quorum
          </td>
        </tr>
        <tr>
          <td class="card pad" style="background-color:#ffffff;border:1px solid #e6e6ea;border-radius:16px;padding:32px 36px;font-family:'Segoe UI',Helvetica,Arial,sans-serif;color:#1a1a1a;">
            <div align="center" style="padding-bottom:8px;">
              <img class="mascot" src="{{mascotUrl}}" width="160" height="160" alt="{{mascotName}} mascot" style="display:block;width:160px;height:160px;border:0;">
            </div>
            {{{content}}}
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" style="margin:28px auto 8px auto;">
              <tr>
                <td align="center" style="border-radius:10px;background-color:{{accent}};">
                  <a href="{{ctaUrl}}" style="display:inline-block;padding:13px 28px;font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:15px;font-weight:600;color:#ffffff;text-decoration:none;border-radius:10px;">{{ctaLabel}}</a>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td class="muted" style="padding:20px 12px 0 12px;font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;line-height:1.6;color:#6b7280;text-align:center;">
            You are receiving this because of activity on your Quorum account.<br>
            Change which messages you get in <a href="{{settingsUrl}}" style="color:#6b7280;text-decoration:underline;">Settings</a>.<br>
            Quorum is a simulated trading platform. Nothing here is investment advice, and no real money moves.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
